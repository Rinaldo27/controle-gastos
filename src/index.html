<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Controle financeiro pessoal: receitas, despesas e saldo do mês."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1f1c" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Gastos" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Expense Tracker</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="js/app.js"></script>
  </head>

  <body>
    <header class="cabecalho">
      <p class="cabecalho__marca">
        <img class="cabecalho__icone" src="icons/icon-192.png" alt="" width="32" height="32" />
        <span class="cabecalho__nome">Expense Tracker</span>
      </p>
      <div class="seletor-mes" id="seletor-mes" role="group" aria-label="Mês de referência">
        <button
          type="button"
          id="mes-anterior"
          class="botao-icone"
          aria-label="Mês anterior"
          data-testid="mes-anterior"
        >
          ‹
        </button>
        <span
          id="mes-atual"
          class="seletor-mes__rotulo"
          aria-live="polite"
          data-testid="mes-atual"
        ></span>
        <button
          type="button"
          id="mes-seguinte"
          class="botao-icone"
          aria-label="Próximo mês"
          data-testid="mes-seguinte"
        >
          ›
        </button>
      </div>
    </header>

    <nav class="navegacao" aria-label="Principal">
      <a href="#/resumo" data-rota="resumo" data-testid="nav-resumo">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 4h6v7H4zM14 4h6v4h-6zM14 12h6v8h-6zM4 15h6v5H4z" />
        </svg>
        <span>Resumo</span>
      </a>
      <a href="#/lancamentos" data-rota="lancamentos" data-testid="nav-lancamentos">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01" />
        </svg>
        <span>Lançamentos</span>
      </a>
      <a href="#/relatorios" data-rota="relatorios" data-testid="nav-relatorios">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 20V11M12 20V4M19 20v-6" />
        </svg>
        <span>Relatórios</span>
      </a>
      <a href="#/ajustes" data-rota="ajustes" data-testid="nav-ajustes">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h9M19 7h1M4 17h1M11 17h9" />
          <circle cx="16" cy="7" r="2.5" />
          <circle cx="8" cy="17" r="2.5" />
        </svg>
        <span>Ajustes</span>
      </a>
    </nav>

    <aside
      id="banner-instalar"
      class="banner"
      aria-label="Instalar o aplicativo"
      data-testid="banner-instalar"
      hidden
    >
      <p id="banner-instalar-texto" class="banner__texto"></p>
      <div class="banner__acoes">
        <button
          type="button"
          id="banner-instalar-sim"
          class="botao botao--primario"
          data-testid="banner-instalar-sim"
        >
          Instalar
        </button>
        <button
          type="button"
          id="banner-instalar-nao"
          class="botao botao--secundario"
          data-testid="banner-instalar-nao"
        >
          Agora não
        </button>
      </div>
    </aside>

    <main id="principal" class="principal"></main>

    <button
      type="button"
      id="botao-novo"
      class="fab"
      aria-label="Novo lançamento"
      data-testid="botao-novo"
      hidden
    >
      <span aria-hidden="true">+</span>
    </button>

    <div id="avisos" class="avisos" role="status" aria-live="polite"></div>

    <dialog id="dialogo-lancamento" class="dialogo" aria-labelledby="titulo-formulario">
      <form id="formulario-lancamento" novalidate>
        <h2 id="titulo-formulario">Novo lançamento</h2>

        <fieldset class="segmentado">
          <legend>Tipo</legend>
          <div class="segmentado__opcoes">
            <label
              ><input type="radio" name="tipo" value="despesa" checked /><span>Despesa</span></label
            >
            <label><input type="radio" name="tipo" value="receita" /><span>Receita</span></label>
          </div>
        </fieldset>

        <fieldset class="segmentado" aria-describedby="dica-natureza">
          <legend>É fixa ou variável?</legend>
          <div class="segmentado__opcoes">
            <label
              ><input type="radio" name="natureza" value="variavel" checked /><span
                >Variável</span
              ></label
            >
            <label><input type="radio" name="natureza" value="fixa" /><span>Fixa</span></label>
          </div>
          <p class="campo__dica" id="dica-natureza">
            Fixa se repete todo mês (aluguel, salário). Variável muda de mês a mês (mercado, lazer).
          </p>
        </fieldset>

        <div class="campo">
          <label for="campo-descricao">Descrição</label>
          <input
            id="campo-descricao"
            name="descricao"
            type="text"
            maxlength="80"
            autocomplete="off"
            placeholder="Ex.: Mercado"
            aria-describedby="erro-descricao"
            data-testid="campo-descricao"
          />
          <p class="campo__erro" id="erro-descricao" hidden></p>
        </div>

        <div class="campo">
          <label for="campo-valor">Valor (R$)</label>
          <input
            id="campo-valor"
            name="valor"
            type="text"
            inputmode="decimal"
            autocomplete="off"
            placeholder="0,00"
            aria-describedby="erro-valor"
            data-testid="campo-valor"
          />
          <p class="campo__erro" id="erro-valor" hidden></p>
        </div>

        <div class="campo">
          <label for="campo-data">Data</label>
          <input
            id="campo-data"
            name="data"
            type="date"
            aria-describedby="erro-data"
            data-testid="campo-data"
          />
          <p class="campo__erro" id="erro-data" hidden></p>
        </div>

        <div class="campo">
          <label for="campo-categoria">Categoria</label>
          <select
            id="campo-categoria"
            name="categoria"
            aria-describedby="erro-categoria"
            data-testid="campo-categoria"
          ></select>
          <p class="campo__erro" id="erro-categoria" hidden></p>
        </div>

        <div class="dialogo__acoes">
          <button type="button" id="cancelar-formulario" class="botao botao--secundario">
            Cancelar
          </button>
          <button type="submit" class="botao botao--primario" data-testid="salvar-lancamento">
            Salvar
          </button>
        </div>
      </form>
    </dialog>

    <dialog
      id="dialogo-confirmacao"
      class="dialogo"
      aria-labelledby="confirmacao-titulo"
      aria-describedby="confirmacao-mensagem"
    >
      <form method="dialog">
        <h2 id="confirmacao-titulo"></h2>
        <p id="confirmacao-mensagem"></p>
        <div class="dialogo__acoes">
          <button value="nao" class="botao botao--secundario">Cancelar</button>
          <button
            value="sim"
            id="confirmacao-ok"
            class="botao botao--perigo"
            data-testid="confirmar-exclusao"
          ></button>
        </div>
      </form>
    </dialog>

    <noscript>Este aplicativo precisa de JavaScript para funcionar.</noscript>
  </body>
</html>
